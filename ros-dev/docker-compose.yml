services:
  ros-dev:
    build:
      context: ..
      dockerfile: ros-dev/Dockerfile
    image: mrcodecx/ros-dev:jazzy
    container_name: ros-dev
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_DRIVER_CAPABILITIES=all
      - DISPLAY=${DISPLAY}
      - __NV_PRIME_RENDER_OFFLOAD=1
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
    volumes:
      - ${WORKSPACE}:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${WORKSPACE}/.claude:/home/dev/.claude
      - ${WORKSPACE}/.claude.json:/home/dev/.claude.json
      - ${WORKSPACE}/.codex:/home/dev/.codex
