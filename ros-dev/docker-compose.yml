services:
  ros-dev:
    build:
      context: ..
      dockerfile: ros-dev/Dockerfile
    image: mrcodecx/ros-dev:jazzy
    container_name: ros-dev
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_DRIVER_CAPABILITIES=all
      - DISPLAY=${DISPLAY}
      - __NV_PRIME_RENDER_OFFLOAD=1
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
      - CODEX_HOME=${CONTAINER_HOME}/.codex-data
    volumes:
      - ${WORKSPACE}:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${WORKSPACE}/.docker-data/.claude:${CONTAINER_HOME}/.claude
      - ${WORKSPACE}/.docker-data/.claude.json:${CONTAINER_HOME}/.claude.json
      - ${WORKSPACE}/.docker-data/.codex-data:${CONTAINER_HOME}/.codex-data
      - ${WORKSPACE}/.docker-data/.vscode-server:${CONTAINER_HOME}/.vscode-server
